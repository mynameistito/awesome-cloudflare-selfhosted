name: audit

on:
  pull_request:
    paths: ['data/**', 'README.md', 'scripts/**', 'package.json']
  schedule:
    - cron: '0 6 1 * *'   # monthly, first of the month
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test the config parser
        run: npm test

      # Not `npm run check`: pull requests deliberately do not carry README.md,
      # so it is expected to be behind. This proves the data still builds.
      - name: Check the generated files build
        run: npm run build

      - name: Lint the list against the awesome spec
        run: npm run lint

      - name: Audit entries against GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run audit
